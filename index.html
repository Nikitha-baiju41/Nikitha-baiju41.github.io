<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikitha Baiju| Developer</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  background: #020617;
  color: white;
  font-family: 'Poppins', sans-serif;
}

/* Navbar */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 50px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}

nav h2 {
  font-family: 'Orbitron';
  color: #00f7ff;
}

/* Icon Menu */
.menu {
  text-align: center;
  margin-top: 20px;
}

.menu i {
  font-size: 28px;
  margin: 15px;
  cursor: pointer;
  color: #00f7ff;
  transition: 0.3s;
}

.menu i:hover {
  transform: scale(1.3);
  text-shadow: 0 0 15px #00f7ff;
}

/* Hero */
.hero {
  height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.hero h1 {
  font-size: 50px;
}

.hero span {
  color: #00f7ff;
  text-shadow: 0 0 20px #00f7ff;
}

/* Sections */
.section {
  padding: 60px 20px;
  text-align: center;
}

.section h2 {
  color: #00f7ff;
}

/* Cards */
.card {
  background: rgba(255,255,255,0.05);
  margin: 15px;
  padding: 20px;
  width: 200px;
  border-radius: 12px;
  display: inline-block;
  transition: 0.3s;
  border: 1px solid rgba(0,255,255,0.2);
}

.card:hover {
  transform: translateY(-10px);
  box-shadow: 0 0 20px #00f7ff;
}

/* Hidden sections */
.hidden {
  display: none;
}

/* Line */
.line {
  width: 80px;
  height: 3px;
  background: #00f7ff;
  margin: 10px auto;
}
</style>
</head>

<body>

<!-- Navbar -->
<nav>
  <h2>NIKITHA</h2>
</nav>

<!-- Hero -->
<section class="hero">
  <div>
    <h1>Hi, I'm <span>Nikitha</span></h1>
    <p> UI/UX intern | Tech Enthusiast| Flutter beginner|</p>
  </div>
</section>

<!-- ICON MENU -->
<div class="menu">
  <i class="fas fa-user" onclick="showSection('about')"></i>
  <i class="fas fa-code" onclick="showSection('skills')"></i>
  <i class="fas fa-laptop" onclick="showSection('projects')"></i>
  <i class="fas fa-envelope" onclick="showSection('contact')"></i>
</div>

<!-- ABOUT -->
<section id="about" class="section hidden">
  <h2>About Me</h2>
  <div class="line"></div>
  <p>I am a BTech student passionate about Flutter and building modern apps.</p>
</section>

<!-- SKILLS -->
<section id="skills" class="section hidden">
  <h2>Skills</h2>
  <div class="line"></div>
  <div>
    <div class="card">Flutter</div>
    <div class="card">Dart</div>
    <div class="card">PostgreSQL</div>
    <div class="card">HTML & CSS</div>
  </div>
</section>

<!-- PROJECTS -->
<section id="projects" class="section hidden">
  <h2>Projects</h2>
  <div class="line"></div>
  <div>
    <div class="card">Bank App UI</div>
    <div class="card">Student Database</div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="section hidden">
  <h2>Contact- 9207368216</h2>
  <div class="line"></div>
  <p>Email: nairnisha346@gmail.com</p>
</section>

<!-- SCRIPT -->
<script>
function showSection(id) {
  let sections = document.querySelectorAll('.section');
  sections.forEach(sec => sec.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// Show About first
window.onload = () => showSection('about');
</script>

</body>
</html>
